name: 청약레이더 실제 공고 자동 업데이트

on:
  workflow_dispatch:
  schedule:
    - cron: '17 0 * * *'

permissions:
  contents: write

concurrency:
  group: cheongyak-data-update
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests pymupdf
      - name: Unit tests for price, notices, publishing and frontend
        run: |
          python -m unittest test_v52.py -v
          python - <<'PYJS'
          import re
          from pathlib import Path
          text = Path('index.html').read_text(encoding='utf-8')
          m = re.search(r'<script>\s*(.*?)\s*</script>', text, re.S)
          if not m: raise RuntimeError('Inline JavaScript not found')
          Path('/tmp/cheongyak-app-v52.js').write_text(m.group(1), encoding='utf-8')
          PYJS
          node --check /tmp/cheongyak-app-v52.js
      - name: Fetch official housing data and build V52 market cards
        env:
          DATA_GO_KR_API_KEY: ${{ secrets.DATA_GO_KR_API_KEY }}
          RIGHTS_API_KEY: ${{ secrets.RIGHTS_API_KEY }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
        run: python fetch_live.py
      - name: Validate v52 contract and publish data
        run: python validate_v52.py
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          if ! git diff --cached --quiet; then
            git commit -m "Update housing notices with v52 analysis"
            git push origin HEAD:main
          else
            echo "No changes to commit"
          fi
