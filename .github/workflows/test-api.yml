
name: 수도권 청약 공고 조회 테스트

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-api:
    runs-on: ubuntu-latest

    steps:
      - name: Install requests
        run: pip install requests

      - name: Fetch Seoul Gyeonggi Incheon
        env:
          DATA_GO_KR_API_KEY: ${{ secrets.DATA_GO_KR_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import requests

          key = os.environ["DATA_GO_KR_API_KEY"]

          url = (
              "https://api.odcloud.kr/api/"
              "ApplyhomeInfoDetailSvc/v1/"
              "getAPTLttotPblancDetail"
          )

          regions = ["서울", "경기", "인천"]

          for region in regions:
              print("\n==========", region, "==========")

              response = requests.get(
                  url,
                  params={
                      "serviceKey": key,
                      "page": 1,
                      "perPage": 10,
                      "returnType": "JSON",
                      "cond[SUBSCRPT_AREA_CODE_NM::EQ]": region,
                  },
                  timeout=30,
              )

              print("HTTP:", response.status_code)
              response.raise_for_status()

              result = response.json()
              rows = result.get("data") or []

              print("해당 지역 전체 건수:",
                    result.get("matchCount"))
              print("이번에 조회한 건수:", len(rows))


              for p in rows[:5]:
           
              from datetime import date

              today = date.today()

              for p in rows:
                  name = p.get("HOUSE_NM", "이름 없음")
                  start = p.get("RCEPT_BGNDE")
                  end = p.get("RCEPT_ENDDE")

                  if not start or not end:
                      status = "일정 확인 필요"
                  else:
                      try:
                          start_date = date.fromisoformat(start[:10])
                          end_date = date.fromisoformat(end[:10])

                          if today < start_date:
                              status = "접수 예정"
                          elif today <= end_date:
                              status = "접수 중"
                          else:
                              status = "접수 마감"

                      except (ValueError, TypeError):
                          status = "일정 확인 필요"

                  print(
                      name,
                      "| 시작:", start,
                      "| 종료:", end,
                      "| 상태:", status
                  )
          PY
