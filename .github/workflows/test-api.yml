name: 수도권 청약 공고 조회 테스트

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-api:
    runs-on: ubuntu-latest

    steps:
      - name: Install requests
        run: pip install requests

      - name: Fetch Seoul Gyeonggi Incheon
        env:
          DATA_GO_KR_API_KEY: ${{ secrets.DATA_GO_KR_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import requests
          from datetime import datetime
          from zoneinfo import ZoneInfo

          key = os.environ["DATA_GO_KR_API_KEY"]

          url = (
              "https://api.odcloud.kr/api/"
              "ApplyhomeInfoDetailSvc/v1/"
              "getAPTLttotPblancDetail"
          )

          today = datetime.now(
              ZoneInfo("Asia/Seoul")
          ).date()

          print("한국 기준 날짜:", today)

          for region in ["서울", "경기", "인천"]:
              print("\n==========", region, "==========")

              response = requests.get(
                  url,
                  params={
                      "serviceKey": key,
                      "page": 1,
                      "perPage": 10,
                      "returnType": "JSON",
                      "cond[SUBSCRPT_AREA_CODE_NM::EQ]": region,
                  },
                  timeout=30,
              )

              print("HTTP:", response.status_code)
              response.raise_for_status()

              result = response.json()
              rows = result.get("data") or []

              print("전체 지역 공고:",
                    result.get("matchCount"))

              for p in rows:
                  name = p.get("HOUSE_NM", "이름 없음")
                  start = p.get("RCEPT_BGNDE")
                  end = p.get("RCEPT_ENDDE")

                  if not start or not end:
                      status = "일정 확인 필요"
                  else:
                      try:
                          start_date = (
                              datetime.fromisoformat(
                                  str(start)[:10]
                              ).date()
                          )
                          end_date = (
                              datetime.fromisoformat(
                                  str(end)[:10]
                              ).date()
                          )

                          if today < start_date:
                              status = "접수 예정"
                          elif today <= end_date:
                              status = "접수 중"
                          else:
                              status = "접수 마감"

                      except (ValueError, TypeError):
                          status = "일정 확인 필요"

                  print(
                      name,
                      "| 시작:", start,
                      "| 종료:", end,
                      "| 상태:", status
                  )
          PY
