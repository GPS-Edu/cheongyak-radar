
name: 청약홈 실제 API 테스트

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-api:
    runs-on: ubuntu-latest

    steps:
      - name: Install requests
        run: pip install requests

      - name: Compare housing APIs
        env:
          DATA_GO_KR_API_KEY: ${{ secrets.DATA_GO_KR_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import requests

          key = os.environ["DATA_GO_KR_API_KEY"]

          base = (
              "https://api.odcloud.kr/api/"
              "ApplyhomeInfoDetailSvc/v1/"
          )

          apis = {
              "일반 아파트 분양": "getAPTLttotPblancDetail",
              "무순위·잔여세대": "getRemndrLttotPblancDetail",
          }

          for name, endpoint in apis.items():
              print("\n==========", name, "==========")

              response = requests.get(
                  base + endpoint,
                  params={
                      "serviceKey": key,
                      "page": 1,
                      "perPage": 10,
                      "returnType": "JSON",
                  },
                  timeout=30,
              )

              print("HTTP:", response.status_code)
              response.raise_for_status()
              result = response.json()

              print("응답 항목:", list(result.keys()))
              print("전체 건수:", result.get("totalCount"))
              print("검색 건수:", result.get("matchCount"))
              print("현재 건수:", result.get("currentCount"))

              rows = result.get("data") or []
              print("실제 데이터 수:", len(rows))

              for row in rows[:5]:
                  print(
                      "공고:",
                      row.get("HOUSE_NM"),
                      "| 지역:",
                      row.get("SUBSCRPT_AREA_CODE_NM"),
                      "| 날짜:",
                      row.get("RCRIT_PBLANC_DE"),
                  )
          PY
